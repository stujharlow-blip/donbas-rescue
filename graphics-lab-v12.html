<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>Predator Rising — Graphics Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#060c10;color:#e9f3ee;font:14px system-ui;overflow:hidden}#view{position:fixed;inset:0}#ui{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:15px;background:linear-gradient(#06131de8,transparent);pointer-events:none}h2{font-size:17px;margin:0 0 7px}#status{color:#e7c99d;font-weight:700}#bottom{position:fixed;bottom:0;padding:14px 14px max(20px,env(safe-area-inset-bottom));background:#09161de8;width:100%;line-height:1.5}a{color:#a8e7d1}button{font:700 14px system-ui;padding:10px;background:#234a45;border:1px solid #8dc1ad;color:white;border-radius:8px}#bottom{max-height:25vh;overflow:auto;font-size:12px}#combatHud{position:fixed;top:95px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;color:#dfffe7;text-shadow:0 2px 4px #000}#aim{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);color:#9fffe3;font-size:38px;pointer-events:none;text-shadow:0 1px 6px #000}#fireControls{position:fixed;bottom:27vh;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}#fireControls button{pointer-events:auto;background:#9c2d27;border:2px solid #ffc3a2;font-size:20px;padding:18px 24px;border-radius:50px;touch-action:manipulation}#fireControls #reload{background:#1c5255;font-size:15px;padding:14px;border-radius:14px}</style></head><body><div id="view"></div><div id="ui"><h2>PREDATOR RISING · GRAPHICS LAB V12</h2><div id="status">Starting 3D engine…</div></div><div id="combatHud"><span id="hud">ENEMY 100 · YOU 100 · AMMO 12</span><span id="score">SCORE 0</span></div><div id="aim">＋</div><div id="fireControls"><button id="reload">RELOAD</button><button id="fire">FIRE</button></div><div id="bottom">Drag on the 3D view to aim, then press FIRE · full-body Soldier placeholder · main game untouched.<p><a href="./?v=76481d5">RETURN TO WORKING GAME</a></p><button id="spin">Pause rotation</button> <div id="clips" style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap"></div><div style="display:flex;gap:7px;margin-top:8px;flex-wrap:wrap"><button id="approach">Approach</button><button id="auto">Auto enemy ON</button><button id="attack">Attack test</button><button id="hit">Hit reaction</button><button id="reset">Reset</button></div><div id="combat" style="margin-top:5px;color:#c9dcd4">Combat test ready · HP 100</div> <button id="switch">Show robot fallback</button></div><script type="importmap">{"imports":{"three":"https://esm.sh/three@0.160.1","three/addons/":"https://esm.sh/three@0.160.1/examples/jsm/"}}</script><script type="module">
const status=document.getElementById('status');const report=s=>status.textContent=s;
try{
const THREE=await import('three');
const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
report('Engine ready · downloading animated 3D asset…');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0d171d);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,1.6,5.5);const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('view').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9dd5d5,0x292a2c,2.5));const key=new THREE.DirectionalLight(0xffd4a2,3);key.position.set(-3,7,5);scene.add(key);const rim=new THREE.PointLight(0x24c8ad,60,9);rim.position.set(3,3,-3);scene.add(rim);const floor=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.8,.25,48),new THREE.MeshStandardMaterial({color:0x303e43,metalness:.75,roughness:.5}));floor.position.y=-.14;scene.add(floor);
const root=new THREE.Group();scene.add(root);camera.lookAt(0,1.35,0);const calibration=new THREE.Mesh(new THREE.IcosahedronGeometry(.42,1),new THREE.MeshBasicMaterial({color:0xffb43a}));calibration.position.set(0,1.35,0);scene.add(calibration);let mixer=null,rotating=false,alienMode=true,loaded=null;const switchBtn=document.getElementById('switch');switchBtn.onclick=()=>{alienMode=!alienMode;switchBtn.textContent=alienMode?'Show robot fallback':'Show full-body rig';loadModel()};document.getElementById('spin').textContent='Resume rotation';document.getElementById('auto').textContent='Auto enemy OFF';document.getElementById('spin').onclick=()=>{rotating=!rotating;document.getElementById('spin').textContent=rotating?'Pause rotation':'Resume rotation'};
const combat=document.getElementById('combat');let hp=100,playerHP=100,ammo=12,score=0,autoEnemy=false,mode='idle',timer=0,flash=0,baseX=0,shotFlash=0;const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();const hud=document.getElementById('hud'),scoreEl=document.getElementById('score');function updateHUD(){hud.textContent='ENEMY '+hp+' · YOU '+playerHP+' · AMMO '+ammo;scoreEl.textContent='SCORE '+score;}const fireButton=document.getElementById('fire');let aimX=0,aimY=-.12,dragging=false;const aimEl=document.getElementById('aim');function setAim(x,y){aimX=Math.max(-.85,Math.min(.85,x/innerWidth*2-1));aimY=Math.max(-.7,Math.min(.7,-(y/innerHeight*2-1)));aimEl.style.left=x+'px';aimEl.style.top=y+'px';}renderer.domElement.style.touchAction='none';renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;setAim(e.clientX,e.clientY);renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(dragging)setAim(e.clientX,e.clientY)});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointercancel',()=>dragging=false);const clipsDiv=document.getElementById('clips');let activeAction=null;function playClip(clip){if(!mixer||!loaded||hp<=0)return;const next=mixer.clipAction(clip);next.reset().play();if(activeAction&&activeAction!==next)activeAction.fadeOut(.2);next.fadeIn(.2);activeAction=next;report('PLAYING '+clip.name.toUpperCase()+' · FULL BODY RIG');}document.getElementById('auto').onclick=()=>{autoEnemy=!autoEnemy;document.getElementById('auto').textContent='Auto enemy '+(autoEnemy?'ON':'OFF');};function shoot(){if(!loaded||hp<=0){combat.textContent='Press Reset to play again';return;}if(ammo<=0){combat.textContent='OUT OF AMMO · PRESS RELOAD';return;}ammo--;shotFlash=.12;raycaster.setFromCamera(new THREE.Vector2(aimX,aimY),camera);const hits=raycaster.intersectObject(root,true).filter(h=>h.object.isMesh);if(hits.length){hp=Math.max(0,hp-25);flash=.25;mode=hp===0?'down':'hit';if(hp===0){if(mixer)mixer.timeScale=0;autoEnemy=false;document.getElementById('auto').textContent='Auto enemy OFF';}timer=0;score+=hp===0?100:25;combat.textContent='HIT! Enemy HP '+hp+' · Ammo '+ammo+' · Score '+score;}else combat.textContent='MISS · Aim at enemy';updateHUD();}fireButton.onclick=shoot;document.getElementById('reload').onclick=()=>{ammo=12;combat.textContent='RELOADED · 12 ROUNDS';updateHUD();};document.getElementById('approach').onclick=()=>{mode='approach';timer=0;combat.textContent='APPROACH · enemy advancing';};document.getElementById('attack').onclick=()=>{mode='attack';timer=0;combat.textContent='ATTACK TEST · proximity strike (procedural, not a native attack clip)';};document.getElementById('hit').onclick=()=>{if(!loaded)return;hp=Math.max(0,hp-25);flash=.35;mode=hp===0?'down':'hit';if(hp===0){if(mixer)mixer.stopAllAction();activeAction=null;autoEnemy=false;document.getElementById('auto').textContent='Auto enemy OFF';}timer=0;combat.textContent='HIT REGISTERED · HP '+hp+(hp===0?' · DOWN':'');updateHUD();};document.getElementById('reset').onclick=()=>{hp=100;playerHP=100;ammo=12;score=0;mode='idle';timer=0;root.position.set(0,0,0);root.rotation.z=0;if(mixer){mixer.timeScale=1;mixer.stopAllAction();const idle=mixer._actions.find(a=>/idle/i.test(a._clip.name))||mixer._actions[0];if(idle){idle.reset().play();activeAction=idle;}}combat.textContent='RESET · Enemy 100 · You 100 · Ammo 12';updateHUD();};const loader=new GLTFLoader();let requestId=0;function loadModel(){const id=++requestId;report(alienMode?'Loading combat animation test rig…':'Loading animated robot fallback…');const url=alienMode?'https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/models/gltf/Soldier.glb':'https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/models/gltf/RobotExpressive/RobotExpressive.glb';loader.load(url,gltf=>{if(id!==requestId)return;try{while(root.children.length)root.remove(root.children[0]);mixer=null;activeAction=null;clipsDiv.replaceChildren();mode='idle';hp=100;playerHP=100;ammo=12;root.position.set(0,0,0);root.rotation.z=0;const model=gltf.scene;model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3()),largest=Math.max(size.x,size.y,size.z);if(!Number.isFinite(largest)||largest<.00001)throw Error('Model has invalid bounds');const k=2.7/largest;model.scale.multiplyScalar(k);model.position.sub(center.multiplyScalar(k));model.position.y+=1.45;root.add(model);loaded=model;calibration.visible=false;camera.position.set(0,1.45,5.7);camera.lookAt(0,1.45,0);if(gltf.animations.length){mixer=new THREE.AnimationMixer(model);const clip=gltf.animations.find(c=>/run/i.test(c.name))||gltf.animations.find(c=>/walk/i.test(c.name))||gltf.animations[0];playClip(clip);for(const anim of gltf.animations){const b=document.createElement('button');b.textContent=anim.name;b.onclick=()=>playClip(anim);clipsDiv.appendChild(b)}}report((alienMode?'COMBAT RIG':'ROBOT')+' FRAMED · '+gltf.animations.length+' ANIMATION CLIPS · TAP BUTTONS BELOW');}catch(err){console.error(err);calibration.visible=true;report('MODEL FRAMING ERROR · '+err.message)}},e=>{if(id===requestId&&e.total)report('Downloading model · '+Math.round(100*e.loaded/e.total)+'%')},err=>{if(id===requestId){console.error(err);calibration.visible=true;report('MODEL LOAD FAILED · '+(err.message||'network error')+' · TRY ROBOT FALLBACK')}})}loadModel();updateHUD();
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(mixer)mixer.update(dt);timer+=dt;if(autoEnemy&&mode==='idle'&&hp>0&&timer>1.2){mode='approach';timer=0;}if(mode==='approach'&&hp>0){root.position.z=Math.min(1.2,root.position.z+dt*.4);if(timer>3){mode='attack';timer=0;combat.textContent='ENEMY ATTACKING · Enemy '+hp+' · You '+playerHP}}else if(mode==='attack'&&hp>0){root.rotation.z=Math.sin(Math.min(timer,1)*Math.PI)*-.22;if(timer>1){root.rotation.z=0;playerHP=Math.max(0,playerHP-10);mode=playerHP===0?'playerdown':'idle';timer=0;combat.textContent='ENEMY STRIKE · Your HP '+playerHP+' · Enemy HP '+hp+' · Ammo '+ammo;updateHUD();}}else if(mode==='hit'&&hp>0){root.rotation.z=Math.sin(Math.min(timer,.5)*Math.PI*2)*.2;if(timer>.5){root.rotation.z=0;mode=hp===0?'down':'idle';}}else if(mode==='down'){root.rotation.z=Math.min(1.35,root.rotation.z+dt*1.5);}if(flash>0)flash-=dt;if(shotFlash>0)shotFlash-=dt;scene.background.setHex(shotFlash>0?0x34434a:flash>0?0x352026:0x0d171d);if(rotating&&hp>0)root.rotation.y+=dt*.35;if(alienMode&&loaded&&hp>0)loaded.position.y+=Math.sin(clock.elapsedTime*2)*dt*.045;renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(err){console.error(err);report('ENGINE ERROR · '+(err.message||String(err)))}
</script></body></html>
