<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>Predator Rising — Graphics Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#060c10;color:#e9f3ee;font:14px system-ui;overflow:hidden}#view{position:fixed;inset:0}#ui{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:15px;background:linear-gradient(#06131de8,transparent);pointer-events:none}h2{font-size:17px;margin:0 0 7px}#status{color:#e7c99d;font-weight:700}#bottom{position:fixed;bottom:0;padding:14px 14px max(20px,env(safe-area-inset-bottom));background:#09161de8;width:100%;line-height:1.5}a{color:#a8e7d1}button{font:700 14px system-ui;padding:10px;background:#234a45;border:1px solid #8dc1ad;color:white;border-radius:8px}</style></head><body><div id="view"></div><div id="ui"><h2>PREDATOR RISING · GRAPHICS LAB V5</h2><div id="status">Starting 3D engine…</div></div><div id="bottom">Full-body six-legged alien creature test (CC0) · main game untouched.<p><a href="./?v=76481d5">RETURN TO WORKING GAME</a></p><button id="spin">Pause rotation</button> <button id="switch">Show robot fallback</button></div><script type="importmap">{"imports":{"three":"https://esm.sh/three@0.160.1","three/addons/":"https://esm.sh/three@0.160.1/examples/jsm/"}}</script><script type="module">
const status=document.getElementById('status');const report=s=>status.textContent=s;
try{
const THREE=await import('three');
const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
report('Engine ready · downloading animated 3D asset…');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0d171d);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,1.6,5.5);const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('view').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9dd5d5,0x292a2c,2.5));const key=new THREE.DirectionalLight(0xffd4a2,3);key.position.set(-3,7,5);scene.add(key);const rim=new THREE.PointLight(0x24c8ad,60,9);rim.position.set(3,3,-3);scene.add(rim);const floor=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.8,.25,48),new THREE.MeshStandardMaterial({color:0x303e43,metalness:.75,roughness:.5}));floor.position.y=-.14;scene.add(floor);
const root=new THREE.Group();scene.add(root);camera.lookAt(0,1.35,0);const calibration=new THREE.Mesh(new THREE.IcosahedronGeometry(.42,1),new THREE.MeshBasicMaterial({color:0xffb43a}));calibration.position.set(0,1.35,0);scene.add(calibration);let mixer=null,rotating=true,alienMode=true,loaded=null;const switchBtn=document.getElementById('switch');switchBtn.onclick=()=>{alienMode=!alienMode;switchBtn.textContent=alienMode?'Show robot fallback':'Show alien';loadModel()};document.getElementById('spin').onclick=()=>{rotating=!rotating;document.getElementById('spin').textContent=rotating?'Pause rotation':'Resume rotation'};
const loader=new GLTFLoader();let requestId=0;function loadModel(){const id=++requestId;report(alienMode?'Loading full-body alien creature…':'Loading animated robot fallback…');const url=alienMode?'https://cdn.3dassets.dev/assets/21107/v1/model.glb':'https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/models/gltf/RobotExpressive/RobotExpressive.glb';loader.load(url,gltf=>{if(id!==requestId)return;try{while(root.children.length)root.remove(root.children[0]);mixer=null;const model=gltf.scene;model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3()),largest=Math.max(size.x,size.y,size.z);if(!Number.isFinite(largest)||largest<.00001)throw Error('Model has invalid bounds');const k=2.7/largest;model.scale.multiplyScalar(k);model.position.sub(center.multiplyScalar(k));model.position.y+=1.45;root.add(model);loaded=model;calibration.visible=false;camera.position.set(0,1.45,5.7);camera.lookAt(0,1.45,0);if(gltf.animations.length){mixer=new THREE.AnimationMixer(model);const clip=gltf.animations.find(c=>/run/i.test(c.name))||gltf.animations.find(c=>/walk/i.test(c.name))||gltf.animations[0];mixer.clipAction(clip).play()}report((alienMode?'ALIEN':'ROBOT')+' MODEL FRAMED · '+gltf.scene.children.length+' ROOT OBJECTS · SIZE '+largest.toFixed(2));}catch(err){console.error(err);calibration.visible=true;report('MODEL FRAMING ERROR · '+err.message)}},e=>{if(id===requestId&&e.total)report('Downloading model · '+Math.round(100*e.loaded/e.total)+'%')},err=>{if(id===requestId){console.error(err);calibration.visible=true;report('MODEL LOAD FAILED · '+(err.message||'network error')+' · TRY ROBOT FALLBACK')}})}loadModel();
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(mixer)mixer.update(dt);if(rotating)root.rotation.y+=dt*.35;if(alienMode&&loaded)loaded.position.y+=Math.sin(clock.elapsedTime*2)*dt*.045;renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(err){console.error(err);report('ENGINE ERROR · '+(err.message||String(err)))}
</script></body></html>
