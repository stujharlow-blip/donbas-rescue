<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0d1921"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Donbas Rescue"><title>Donbas Rescue — Range</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08131b;color:#f4f6ed;font:600 14px system-ui,-apple-system,sans-serif;touch-action:none}button{font:inherit;color:inherit;touch-action:none;user-select:none;-webkit-user-select:none}.game{height:100dvh;height:100svh;width:100vw;display:flex;flex-direction:column;overflow:hidden}.hud{height:34px;flex:none;background:#0c1b25;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px}.hud small{font-size:11px;color:#a5c4c7}.hud button{border:1px solid #6d9da3;background:#244c5a;border-radius:8px;padding:7px}.scene{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(#6994ad,#c1bda1 55%,#465a43 56%,#263e32);touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.reticle{pointer-events:none;position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%);border:2px solid #f2f8ed;border-radius:50%;filter:drop-shadow(0 1px 2px #172b27)}.reticle:before,.reticle:after{content:"";position:absolute;background:#f2f8ed}.reticle:before{height:2px;width:64px;left:-12px;top:19px}.reticle:after{width:2px;height:64px;left:19px;top:-12px}.reticle.lock{border-color:#8cff83;filter:drop-shadow(0 0 5px #68ff65)}.reticle.lock:before,.reticle.lock:after{background:#8cff83}.hint[hidden]{display:none}.hint{position:absolute;bottom:9px;left:10px;background:#102720b8;padding:6px 9px;border-radius:5px;font-size:11px;pointer-events:none}.controls{height:24%;min-height:112px;max-height:205px;flex:none;background:#112630;padding:10px;display:flex;gap:10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}.pad{flex:1;border:3px solid #87b5c4;border-radius:15px;background:linear-gradient(130deg,#34586a,#203e4c);touch-action:none;box-shadow:inset 0 0 24px #132e3c}.buttons{width:27%;max-width:130px;display:flex;flex-direction:column;gap:8px}.buttons button{flex:1;border:2px solid #7fa8b1;border-radius:13px;background:#346e5e;font-weight:800;font-size:clamp(12px,3.6vw,18px)}.buttons .grenade{background:#81543d;border-color:#b08e7b}.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 60%,#ffdb91b0,transparent 62%)}@media(orientation:landscape){.hud{height:28px}.controls{height:27%;min-height:75px;padding:6px}.buttons{max-width:160px;flex-direction:row;width:32%}.buttons button{font-size:12px}.hint{font-size:10px}}</style></head>
<body><div class="game"><div class="hud"><span id="score">HITS 0 · SHOTS 0</span><small id="ammo">MP5 · SUPPRESSED</small><button id="sound">SOUND ON</button></div><div class="scene" id="scene"><canvas id="canvas"></canvas><div class="reticle" id="reticle"></div><div class="flash" id="flash"></div><div class="hint" id="hint" hidden></div></div><div class="controls"><div class="pad" id="pad" aria-label="Aim touchpad"></div><div class="buttons"><button id="move">STOP ▸</button><button class="grenade" id="grenade">GRENADE</button></div></div></div>
<script>
(()=>{'use strict';const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),scene=document.getElementById('scene'),pad=document.getElementById('pad'),reticle=document.getElementById('reticle'),flash=document.getElementById('flash'),hint=document.getElementById('hint');let w=0,h=0,dpr=1,yaw=0,pitch=0,hits=0,shots=0,mode=0,last=performance.now(),audio=null,soundOn=true,explosions=[],particles=[],shotsFx=[],fireTimes=[];const modes=['STOP','WALK','RUN','DUCK'];const targets=[{x:-1.45,z:5.5,id:1,alive:true},{x:-.5,z:7.8,id:2,alive:true},{x:.8,z:5.9,id:3,alive:true},{x:1.85,z:8.7,id:4,alive:true},{x:-2.8,z:10,id:5,alive:true},{x:2.9,z:11,id:6,alive:true}];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){const r=scene.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);w=Math.max(1,r.width);h=Math.max(1,r.height);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(scene);resize();function initAudio(){if(!soundOn)return null;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}catch(e){return null}}function tone(freq,dur,type='sine',vol=.08,delay=0,slide=0){const a=initAudio();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.01)}function noise(dur,vol,low=700,delay=0){const a=initAudio();if(!a)return;const t=a.currentTime+delay,n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=low;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t)}function mp5(){tone(115,.075,'triangle',.13,0,58);noise(.075,.12,1100);tone(460,.035,'square',.012)}function boom(){tone(105,.65,'sine',.4,0,27);noise(.9,.45,260);tone(43,.7,'triangle',.15)}function project(x,z){const rel=x-yaw*z*.6,depth=Math.max(1,z);const scale=Math.min(1.8,5.7/depth);return{x:w/2+rel*w*.21*scale,y:h*.55+pitch*h*.36+(depth-6)*h*.012,scale}}function circle(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}function drawTarget(t,time){if(!t.alive)return;const p=project(t.x,t.z),r=clamp(w*.06*p.scale,9,40);if(p.x<-r*2||p.x>w+r*2)return;t.sx=p.x;t.sy=p.y-r*.7;t.r=r;const sway=Math.sin(time*.0014+t.id)*r*.09;const y=p.y-r*.7+sway;t.sy=y;ctx.strokeStyle='#272f2b';ctx.lineWidth=Math.max(3,r*.11);ctx.beginPath();ctx.moveTo(p.x,p.y+r*.5);ctx.lineTo(p.x,p.y+r*1.8);ctx.stroke();circle(p.x+3,y+4,r*1.15,'#1c2a26aa');circle(p.x,y,r*1.08,'#27322e');circle(p.x,y,r,'#e7e4d6');circle(p.x,y,r*.82,'#a83932');circle(p.x,y,r*.62,'#f0e5cc');circle(p.x,y,r*.41,'#ad3d32');circle(p.x,y,r*.22,'#f5d77b');ctx.fillStyle='#1e2b2d';ctx.font='bold '+Math.round(r*.5)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.id,p.x,y+1)}function tree(x,z){const p=project(x,z),s=clamp(6/z,.35,1.4),trunk=15*s;ctx.fillStyle='#352f26';ctx.fillRect(p.x-3*s,p.y-35*s,6*s,40*s);for(let i=0;i<3;i++){ctx.fillStyle=['#344c35','#284630','#40583a'][i];ctx.beginPath();ctx.moveTo(p.x,p.y-(88-i*18)*s);ctx.lineTo(p.x-(23-i*3)*s,p.y-(35-i*13)*s);ctx.lineTo(p.x+(23-i*3)*s,p.y-(35-i*13)*s);ctx.fill()}}function building(x,z){const p=project(x,z),s=clamp(7/z,.4,1.5),bw=78*s,bh=75*s;ctx.fillStyle='#585c51';ctx.fillRect(p.x-bw/2,p.y-bh,bw,bh);ctx.fillStyle='#454c48';ctx.beginPath();ctx.moveTo(p.x-bw*.6,p.y-bh);ctx.lineTo(p.x,p.y-bh-20*s);ctx.lineTo(p.x+bw*.6,p.y-bh);ctx.fill();ctx.fillStyle='#222f32';for(let i=-1;i<=1;i++)ctx.fillRect(p.x+i*22*s-6*s,p.y-bh+18*s,12*s,18*s);ctx.fillStyle='#777866';ctx.fillRect(p.x-7*s,p.y-25*s,14*s,25*s)}function draw(time){const dt=Math.min(.05,(time-last)/1000);last=time;if(mode===1)yaw+=dt*.035;if(mode===2)yaw+=dt*.07;const horizon=h*(.55+pitch*.36);const sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#4b819f');sky.addColorStop(.72,'#a6bdba');sky.addColorStop(1,'#ded2a6');ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon);circle(w*.78-yaw*17,h*.16,Math.max(18,w*.065),'#f2db9caa');ctx.fillStyle='#77897b';ctx.beginPath();ctx.moveTo(0,horizon);for(let x=0;x<=w+10;x+=10)ctx.lineTo(x,horizon-20-18*Math.sin(x*.015+yaw*.2)-8*Math.cos(x*.05));ctx.lineTo(w,horizon+15);ctx.fill();const ground=ctx.createLinearGradient(0,horizon,0,h);ground.addColorStop(0,'#738061');ground.addColorStop(.6,'#4a5d41');ground.addColorStop(1,'#263d32');ctx.fillStyle=ground;ctx.fillRect(0,horizon,w,h-horizon);ctx.fillStyle='#796c52';ctx.beginPath();ctx.moveTo(w*.43,horizon);ctx.lineTo(w*.57,horizon);ctx.lineTo(w*.89,h);ctx.lineTo(w*.1,h);ctx.fill();ctx.strokeStyle='#a99b78';ctx.lineWidth=1;for(let z=2;z<18;z+=2){const y=horizon+(h-horizon)*Math.pow(2/z,.65);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.globalAlpha=.1;ctx.stroke()}ctx.globalAlpha=1;[[-3.7,7],[-2.4,12],[3.7,7.5],[2.8,12],[-4.4,5.5]].forEach(p=>tree(...p));building(-2.2,9.5);building(3.1,11);targets.forEach(t=>drawTarget(t,time));explosions=explosions.filter(e=>time-e.at<1000);explosions.forEach(e=>{const age=(time-e.at)/1000,r=12+age*140;circle(e.x,e.y,r,'rgba(255,154,47,'+(1-age)*.23+')');circle(e.x,e.y,r*.55,'rgba(255,223,121,'+(1-age)*.7+')');circle(e.x,e.y,r*.22,'rgba(255,246,202,'+(1-age)*.9+')')});particles=particles.filter(p=>time-p.at<650);particles.forEach(p=>{const age=(time-p.at)/650;circle(p.x+p.vx*age,p.y+p.vy*age,Math.max(1,4*(1-age)),p.color)});shotsFx=shotsFx.filter(s=>time-s<95);if(shotsFx.length){ctx.fillStyle='#ffdb9b';ctx.beginPath();ctx.moveTo(w*.46,h);ctx.lineTo(w*.5,h*.75);ctx.lineTo(w*.54,h);ctx.fill()}const lock=targets.some(t=>t.alive&&Math.hypot((t.sx||-999)-w/2,(t.sy||-999)-h/2)<(t.r||0)*.9);reticle.classList.toggle('lock',lock);requestAnimationFrame(draw)}requestAnimationFrame(draw);function update(){document.getElementById('score').textContent='HITS '+hits+' · SHOTS '+shots}function shoot(){initAudio();shots++;mp5();shotsFx.push(performance.now());let target=null,dist=1e9;for(const t of targets){if(!t.alive)continue;const d=Math.hypot((t.sx||-999)-w/2,(t.sy||-999)-h/2);if(d<Math.max(17,(t.r||0)*1.1)&&d<dist){target=t;dist=d}}if(target){target.alive=false;hits++;for(let i=0;i<16;i++)particles.push({x:target.sx,y:target.sy,vx:(Math.random()-.5)*130,vy:(Math.random()-.5)*120,at:performance.now(),color:i%2?'#ffe3a1':'#e9f1da'});tone(730,.11,'sine',.055)}update();if(target&&targets.every(t=>!t.alive)){hint.textContent='RANGE CLEARED — NEW TARGETS IN 2 SECONDS';setTimeout(()=>{targets.forEach(t=>t.alive=true);hint.textContent=''},2000)}}scene.addEventListener('pointerdown',e=>{e.preventDefault();const now=performance.now();fireTimes=fireTimes.filter(t=>now-t<650);fireTimes.push(now);shoot();if(fireTimes.length>=3){setTimeout(shoot,85);setTimeout(shoot,175);fireTimes=[]}});let pointer=null,px=0,py=0;pad.addEventListener('pointerdown',e=>{e.preventDefault();pointer=e.pointerId;px=e.clientX;py=e.clientY;pad.setPointerCapture(pointer);initAudio()});pad.addEventListener('pointermove',e=>{if(e.pointerId!==pointer)return;e.preventDefault();const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;yaw=clamp(yaw+dx/Math.max(170,w)*1.4,-3.4,3.4);pitch=clamp(pitch+dy/Math.max(170,h)*1.1,-.8,.8)});function release(e){if(e.pointerId===pointer)pointer=null}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);document.getElementById('move').addEventListener('click',()=>{mode=(mode+1)%4;document.getElementById('move').textContent=modes[mode]+' ▸'});document.getElementById('grenade').addEventListener('click',()=>{initAudio();boom();const x=w/2,y=h*.54;explosions.push({x,y,at:performance.now()});for(const t of targets){if(t.alive&&Math.hypot((t.sx||-999)-x,(t.sy||-999)-y)<w*.35){t.alive=false;hits++}}for(let i=0;i<42;i++)particles.push({x,y,vx:(Math.random()-.5)*w*.9,vy:(Math.random()-.5)*h*.8,at:performance.now(),color:i%3?'#ffb75b':'#d6d2b4'});update();if(targets.every(t=>!t.alive))setTimeout(()=>targets.forEach(t=>t.alive=true),2000)});document.getElementById('sound').addEventListener('click',e=>{soundOn=!soundOn;e.target.textContent=soundOn?'SOUND ON':'SOUND OFF';if(soundOn)initAudio()});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault());window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,180));})();
</script></body></html>
