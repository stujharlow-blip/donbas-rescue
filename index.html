<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b151b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Predator Rising"><title>Predator Rising</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#0a141a;color:white;font:700 13px system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}button{font:inherit;color:white;touch-action:none}.game{height:100dvh;display:flex;flex-direction:column}.hud{height:56px;background:#10212a;padding:5px 10px;display:flex;flex-wrap:wrap;align-content:center;justify-content:space-between;gap:3px}.hud span{white-space:nowrap}.scene{position:relative;flex:1;min-height:0;overflow:hidden;background:#28433c}canvas{width:100%;height:100%;display:block}.cross{position:absolute;top:50%;left:50%;width:38px;height:38px;transform:translate(-50%,-50%);border:2px solid #fff9;border-radius:50%;pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:white}.cross:before{width:58px;height:2px;left:-12px;top:16px}.cross:after{height:58px;width:2px;top:-12px;left:16px}.cross.lock{border-color:#7fff7f}.notice{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:#07131ccc;border:1px solid #ffffff66;border-radius:10px;padding:9px 14px;text-align:center;min-width:180px;max-width:90%;pointer-events:none}.notice:empty{display:none}.controls{height:24%;min-height:120px;max-height:210px;padding:8px;display:flex;gap:8px;background:#10232d;padding-bottom:max(8px,env(safe-area-inset-bottom))}.pad{flex:1;border:3px solid #77a5ae;border-radius:14px;background:linear-gradient(140deg,#315467,#1a3440);position:relative}.pad:after{content:"DRAG TO AIM • DOUBLE TAP FIRE";position:absolute;bottom:12px;width:100%;text-align:center;font-size:10px;color:#c5e0e9;pointer-events:none}.buttons{width:27%;max-width:140px;display:flex;flex-direction:column;gap:8px}.buttons button{flex:1;background:#315f51;border:2px solid #8eb2a8;border-radius:12px}.buttons #grenade{background:#7b503b;border-color:#bd917a}.overlay{position:absolute;inset:0;background:#07131cda;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:22px;z-index:3}.overlay[hidden]{display:none}.overlay h1{font-size:30px;margin:0}.overlay p{line-height:1.5;max-width:320px}.overlay button{padding:14px 35px;border-radius:12px;background:#3c755e;border:2px solid #a6e5be;font-size:17px}@media(orientation:landscape){.hud{height:34px}.controls{height:27%;min-height:80px}.buttons{flex-direction:row;width:30%;max-width:210px}.pad:after{bottom:5px}}</style></head><body><div class="game"><div class="hud"><span id="round">ROUND 1 • FOREST</span><span id="lives">♥♥♥</span><span id="score">SCORE 0</span><span id="money">$0</span><span id="best">BEST 0</span><span id="weapon">RIFLE</span></div><div class="scene" id="scene"><canvas id="canvas"></canvas><div id="cross" class="cross"></div><div id="notice" class="notice"></div><div id="overlay" class="overlay"><h1>PREDATOR RISING</h1><p>Dangerous wildlife first. Survive with 3 lives. Headshots earn double cash. Drag the left pad to aim and double-tap it to shoot.</p><button id="start">START HUNT</button></div></div><div class="controls"><div class="pad" id="pad"></div><div class="buttons"><button id="move">STOP ▸</button><button id="grenade">BLAST</button></div></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('canvas'),c=cv.getContext('2d'),scene=$('scene'),pad=$('pad'),levels=[{name:'FOREST',kind:'boar',count:5,weapon:'HUNTING RIFLE',sky:['#628e9a','#c1bb88'],ground:'#355538'},{name:'SNOWFIELD',kind:'wolf',count:6,weapon:'HUNTING RIFLE',sky:['#7e9db6','#e0e8ef'],ground:'#c7d6db'},{name:'DARK WILDERNESS',kind:'bear',count:6,weapon:'ASSAULT RIFLE',sky:['#182a43','#7b6d68'],ground:'#293b34'},{name:'ALIEN SWAMP',kind:'alien',count:7,weapon:'ENERGY BLASTER',sky:['#203d45','#82a886'],ground:'#274c43'},{name:'RUINED CITY',kind:'robot',count:8,weapon:'PLASMA RIFLE',sky:['#47394c','#bc7767'],ground:'#383b42'},{name:'FINAL MACHINE',kind:'boss',count:1,weapon:'PLASMA RIFLE',sky:['#241e2b','#a64435'],ground:'#393136'}];let w=1,h=1,dpr=1,round=0,lives=3,score=0,money=0,best=0,targets=[],shots=0,yaw=0,pitch=0,mode=0,active=false,paused=false,now=0,last=0,fx=[],audio=null,lastTap=0,pid=null,sx=0,sy=0,moved=false,px=0,py=0,grenades=3;try{best=+(localStorage.getItem('predator-rising-best')||0)}catch(e){}function sound(f=170,d=.13,vol=.12,type='sawtooth'){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(35,f*.35),audio.currentTime+d);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function size(){const r=scene.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,2);cv.width=w*dpr;cv.height=h*dpr;c.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(size).observe(scene);size();function ui(){$('round').textContent='ROUND '+(round+1)+' • '+levels[round].name;$('lives').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);$('score').textContent='SCORE '+score;$('money').textContent='$'+money;$('best').textContent='BEST '+best;$('weapon').textContent=levels[round].weapon;$('grenade').textContent='BLAST '+grenades}function notice(s,d=1300){$('notice').textContent=s;if(d)setTimeout(()=>{if($('notice').textContent===s)$('notice').textContent=''},d)}function spawn(){const l=levels[round];targets=Array.from({length:l.count},(_,i)=>({x:(Math.random()-.5)*2.1,y:.42+Math.random()*.29,z:2+Math.random()*2,phase:Math.random()*6.28,hp:l.kind==='boss'?12:l.kind==='bear'?3:l.kind==='robot'?2:1,alive:true,cool:0,hit:0}));grenades=Math.min(3,1+Math.floor(round/2));ui();notice('ROUND '+(round+1)+' — '+l.name,1800)}function start(){round=0;lives=3;score=0;money=0;mode=0;yaw=0;pitch=0;active=true;paused=false;$('overlay').hidden=true;spawn()}$('start').onclick=start;function over(){active=false;$('overlay').hidden=false;$('overlay').innerHTML='<h1>GAME OVER</h1><p>Score: '+score+'<br>Cash: $'+money+'<br>High score: '+best+'</p><button id="again">PLAY AGAIN</button>';$('again').onclick=start}function next(){paused=true;notice('ROUND CLEARED • +$250',1800);score+=250;money+=250;record();setTimeout(()=>{if(!active)return;if(round===levels.length-1){active=false;$('overlay').hidden=false;$('overlay').innerHTML='<h1>YOU SURVIVED!</h1><p>Final score: '+score+'<br>Cash: $'+money+'<br>High score: '+best+'</p><button id="again">PLAY AGAIN</button>';$('again').onclick=start;return}round++;spawn();paused=false},1900)}function record(){if(score>best){best=score;try{localStorage.setItem('predator-rising-best',String(best))}catch(e){}}ui()}function damage(){if(!active||paused)return;lives--;sound(75,.45,.25);notice('YOU WERE HIT!  -1 LIFE',900);ui();if(lives<=0)over()}function ellipse(x,y,rx,ry,color){c.fillStyle=color;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill()}function drawAnimal(t,kind){const x=t.sx,y=t.sy,s=t.s;const dark=kind==='boar'?'#45342b':kind==='wolf'?'#636e75':kind==='bear'?'#49392f':kind==='alien'?'#3f9c7c':kind==='robot'?'#6e7885':'#656c7d';const bright=kind==='alien'?'#8eff8a':kind==='robot'||kind==='boss'?'#ff4343':'#e6c99a';ellipse(x,y+15*s,39*s,23*s,dark);ellipse(x+26*s,y-5*s,21*s,21*s,dark);if(kind==='robot'||kind==='boss'){c.fillStyle='#9ba7b5';c.fillRect(x-23*s,y-19*s,46*s,35*s);c.fillStyle='#28313b';c.fillRect(x+8*s,y-29*s,36*s,32*s);ellipse(x+19*s,y-17*s,5*s,4*s,bright);ellipse(x+35*s,y-17*s,5*s,4*s,bright);for(let i=-1;i<=1;i+=2){c.fillStyle='#586270';c.fillRect(x+i*24*s,y+25*s,12*s,30*s)}}else{ellipse(x+32*s,y-10*s,8*s,6*s,bright);c.fillStyle=dark;for(let i=-1;i<=1;i+=2){c.beginPath();c.moveTo(x+(21+i*12)*s,y-20*s);c.lineTo(x+(22+i*17)*s,y-43*s);c.lineTo(x+(31+i*10)*s,y-21*s);c.fill()}c.fillStyle='#201e1b';for(let i=-1;i<=1;i+=2)c.fillRect(x+i*24*s,y+28*s,11*s,24*s)}if(kind==='boss'){ellipse(x,y-37*s,27*s,25*s,'#313c46');ellipse(x-11*s,y-40*s,7*s,5*s,'#ff2929');ellipse(x+11*s,y-40*s,7*s,5*s,'#ff2929')}if(t.hit>now)c.fillStyle='#fffb';}function landscape(){const l=levels[round],g=c.createLinearGradient(0,0,0,h*.7);g.addColorStop(0,l.sky[0]);g.addColorStop(1,l.sky[1]);c.fillStyle=g;c.fillRect(0,0,w,h);const horizon=h*(.57+pitch*.18);c.fillStyle=l.ground;c.fillRect(0,horizon,w,h);c.fillStyle=round===1?'#e8f0f2':'#263c39';c.beginPath();c.moveTo(0,horizon);for(let x=0;x<=w;x+=10)c.lineTo(x,horizon-20-22*Math.sin(x*.02+yaw*.5)-8*Math.sin(x*.071));c.lineTo(w,horizon);c.fill();if(round<4){for(let i=0;i<10;i++){const x=((i*119+45-yaw*38)%(w+120)+w+120)%(w+120)-60;const y=horizon+10+(i%3)*16;const s=.6+(i%4)*.25;c.fillStyle=round===1?'#788d9a':'#392f29';c.fillRect(x-4*s,y-95*s,8*s,95*s);for(let j=0;j<3;j++){c.fillStyle=round===1?'#cad6d6':round===3?'#315d4b':'#294c38';c.beginPath();c.moveTo(x,y-(155-j*22)*s);c.lineTo(x-39*s,y-(70-j*14)*s);c.lineTo(x+39*s,y-(70-j*14)*s);c.fill()}}}else{for(let i=0;i<8;i++){const x=((i*105-yaw*40)%(w+130)+w+130)%(w+130)-60;const bh=60+(i%4)*32;c.fillStyle='#333b42';c.fillRect(x,horizon-bh,65,bh);c.fillStyle='#df7645';for(let j=0;j<4;j++)c.fillRect(x+10+j*13,horizon-bh+20,5,7)}}}function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;now=t;c.clearRect(0,0,w,h);landscape();if(active&&!paused){for(const a of targets){if(!a.alive)continue;a.phase+=dt*(.7+round*.22);a.x+=Math.sin(a.phase)*dt*(.14+round*.07);a.z-=dt*(.09+round*.07);if(a.z<.6){a.z=2.7;damage()}if(a.cool<=t&&round>=1){if(Math.random()<dt*(.045+round*.026)){a.cool=t+1500;damage()}}}}const kind=levels[round].kind;for(const a of targets){if(!a.alive)continue;const s=Math.max(.55,Math.min(2.7,2.5/a.z));a.s=s;a.sx=w*.5+(a.x-yaw)*w*.36;a.sy=h*(a.y+pitch*.25)+Math.sin(a.phase*2)*6;drawAnimal(a,kind)}fx=fx.filter(f=>t-f.at<450);for(const f of fx){ellipse(f.x,f.y,(t-f.at)*.1+8,(t-f.at)*.1+8,'rgba(255,192,80,'+(1-(t-f.at)/450)*.6+')')}const lock=targets.some(a=>a.alive&&Math.abs(a.sx-w/2)<25*a.s&&Math.abs(a.sy-h/2)<32*a.s);$('cross').classList.toggle('lock',lock);requestAnimationFrame(frame)}requestAnimationFrame(frame);function fire(){if(!active||paused)return;shots++;const kind=levels[round].kind;sound(round>=3?430:round>=2?210:130,.12,.17,round>=3?'sine':'sawtooth');let target=null,dist=1e9;for(const a of targets){if(!a.alive)continue;const d=Math.hypot((a.sx-w/2)/a.s,(a.sy-h/2)/a.s);if(d<45&&d<dist){target=a;dist=d}}if(target){const head=Math.hypot((target.sx+27*target.s-w/2)/target.s,(target.sy-12*target.s-h/2)/target.s)<20;target.hp-=head?2:1;const gain=head?200:75;money+=gain;score+=head?300:100;notice(head?'HEADSHOT +$200':'HIT +$75',600);target.hit=now+150;if(target.hp<=0){target.alive=false;fx.push({x:target.sx,y:target.sy,at:now});if(targets.every(a=>!a.alive))next()}record()}}function blast(){if(!active||paused||grenades<1)return;grenades--;sound(80,.7,.35);let n=0;for(const a of targets){if(!a.alive)continue;const d=Math.hypot(a.sx-w/2,a.sy-h*.5);if(d<w*.55){a.hp-=3;if(a.hp<=0){a.alive=false;n++}}}score+=n*100;money+=n*50;fx.push({x:w/2,y:h/2,at:now});record();if(targets.every(a=>!a.alive))next()}$('grenade').onclick=blast;$('move').onclick=()=>{mode=(mode+1)%4;$('move').textContent=['STOP','WALK','RUN','DUCK'][mode]+' ▸'};pad.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;px=sx=e.clientX;py=sy=e.clientY;moved=false;pad.setPointerCapture(pid)});pad.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;e.preventDefault();const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;if(Math.hypot(px-sx,py-sy)>13)moved=true;yaw=Math.max(-2,Math.min(2,yaw+dx/Math.max(180,w)*2));pitch=Math.max(-1,Math.min(1,pitch-dy/Math.max(180,h)*2))});pad.addEventListener('pointerup',e=>{if(e.pointerId!==pid)return;if(!moved){const t=performance.now();if(t-lastTap<360){fire();lastTap=0}else lastTap=t}else lastTap=0;pid=null});pad.addEventListener('pointercancel',()=>pid=null);document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault());ui()})();</script></body></html>
