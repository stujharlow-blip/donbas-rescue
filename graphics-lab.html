<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>Predator Rising — Graphics Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#060c10;color:#e9f3ee;font:14px system-ui;overflow:hidden}#view{position:fixed;inset:0}#ui{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:15px;background:linear-gradient(#06131de8,transparent);pointer-events:none}h2{font-size:17px;margin:0 0 7px}#status{color:#e7c99d;font-weight:700}#bottom{position:fixed;bottom:0;padding:14px 14px max(20px,env(safe-area-inset-bottom));background:#09161de8;width:100%;line-height:1.5}a{color:#a8e7d1}button{font:700 14px system-ui;padding:10px;background:#234a45;border:1px solid #8dc1ad;color:white;border-radius:8px}</style></head><body><div id="view"></div><div id="ui"><h2>PREDATOR RISING · GRAPHICS LAB</h2><div id="status">Starting 3D engine…</div></div><div id="bottom">Separate model test — main game remains untouched.<p><a href="./?v=76481d5">RETURN TO WORKING GAME</a></p><button id="spin">Pause rotation</button></div><script type="module">
const status=document.getElementById('status');const report=s=>status.textContent=s;
try{
const THREE=await import('https://esm.sh/three@0.160.1?bundle');
const {GLTFLoader}=await import('https://esm.sh/three@0.160.1/examples/jsm/loaders/GLTFLoader.js?bundle');
report('Engine ready · downloading animated 3D asset…');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0d171d);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,1.6,5.5);const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('view').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9dd5d5,0x292a2c,2.5));const key=new THREE.DirectionalLight(0xffd4a2,3);key.position.set(-3,7,5);scene.add(key);const rim=new THREE.PointLight(0x24c8ad,60,9);rim.position.set(3,3,-3);scene.add(rim);const floor=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.8,.25,48),new THREE.MeshStandardMaterial({color:0x303e43,metalness:.75,roughness:.5}));floor.position.y=-.14;scene.add(floor);
const root=new THREE.Group();scene.add(root);let mixer=null,rotating=true;document.getElementById('spin').onclick=()=>{rotating=!rotating;document.getElementById('spin').textContent=rotating?'Pause rotation':'Resume rotation'};
const loader=new GLTFLoader();loader.load('https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/models/gltf/RobotExpressive/RobotExpressive.glb',gltf=>{const model=gltf.scene;const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),k=2.9/size.y;model.scale.setScalar(k);model.position.y=-bounds.min.y*k;root.add(model);if(gltf.animations.length){mixer=new THREE.AnimationMixer(model);const clip=gltf.animations.find(c=>/walk/i.test(c.name))||gltf.animations[0];mixer.clipAction(clip).play()}report('SUCCESS · REAL ANIMATED GLB MODEL LOADED');},e=>{if(e.total)report('Downloading model · '+Math.round(100*e.loaded/e.total)+'%')},err=>{console.error(err);report('MODEL DOWNLOAD FAILED · '+(err.message||'network error'))});
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(mixer)mixer.update(dt);if(rotating)root.rotation.y+=dt*.35;renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(err){console.error(err);report('ENGINE ERROR · '+(err.message||String(err)))}
</script></body></html>
